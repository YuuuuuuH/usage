<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { width: 1024px; height: 1024px; margin: 0; overflow: hidden; background: transparent; }
body { font-family: "Avenir Next", Avenir, sans-serif; }
.icon {
  position: absolute;
  inset: 62px;
  overflow: hidden;
  border: 3px solid rgba(222, 247, 239, .42);
  border-radius: 210px;
  background: linear-gradient(145deg, #164640, #075c51 68%, #03463f);
  box-shadow: inset 0 2px 1px rgba(255,255,255,.24), 0 40px 65px rgba(4,45,40,.3);
}
.matrix {
  position: absolute;
  left: 158px;
  top: 150px;
  width: 584px;
  height: 584px;
  display: grid;
  grid-template-columns: repeat(4, 128px);
  grid-template-rows: repeat(4, 128px);
  gap: 24px;
}
.cell {
  border: 2px solid rgba(236,255,250,.18);
  border-radius: 28px;
  background: #8bd4bd;
  box-shadow: inset 0 2px 1px rgba(255,255,255,.28), 0 12px 22px rgba(0,35,31,.16);
}
.cell:nth-child(1) { background: #d9f5eb; }
.cell:nth-child(2) { background: #a5dfcc; }
.cell:nth-child(3) { background: #60bda4; }
.cell:nth-child(4) { background: #2f9b83; }
.cell:nth-child(5) { grid-column: 2; background: #70c8b0; }
.cell:nth-child(6) { grid-column: 3; background: #ee7759; box-shadow: inset 0 2px 1px rgba(255,255,255,.28), 0 0 0 9px rgba(238,119,89,.12); }
.cell:nth-child(7) { grid-column: 2; background: #52af98; }
.cell:nth-child(8) { grid-column: 3; background: #87d0bb; }
.cell:nth-child(9) { grid-column: 2; background: #2f8f7b; }
.cell:nth-child(10) { grid-column: 3; background: #62bda6; }
.baseline {
  position: absolute;
  left: 272px;
  right: 272px;
  bottom: 92px;
  height: 7px;
  border-radius: 4px;
  background: rgba(225,250,242,.62);
}
</style>
</head>
<body>
  <div class="icon">
    <div class="matrix">
      <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span>
    </div>
    <div class="baseline"></div>
  </div>
</body>
</html>
