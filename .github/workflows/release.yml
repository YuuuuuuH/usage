name: Build and Release DMG

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and verify DMG
        run: ./scripts/build_dmg.sh

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          checksum_path="dist/Codex Token Atlas.dmg.sha256"
          shasum -a 256 "dist/Codex Token Atlas.dmg" > "$checksum_path"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=Codex Token Atlas ${version} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/Codex Token Atlas.dmg" \
            "dist/Codex Token Atlas.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated installer build for commit $GITHUB_SHA on $GITHUB_REF_NAME."
